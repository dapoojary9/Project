<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <title>Student Regestration system</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <header>
         <h1 class = "header">Student Registration System</h1>
    </header>
    <main class="grid-2col">
        <section class="card">
                    <h2>Students Details</h2>
                    <form id="student-form">
                        <div class="form-group">
                            <label for="student-name">Full Name</label>
                            <input type="text" id="student-name" placeholder="Enter Student Name">
                        </div>
                        <div class="form-group">
                            <label for="student-id">Student ID</label>
                            <input type="number" id="student-id" placeholder="Enter Student ID">
                        </div><div class="form-group">
                            <label for="Email-id">Email-id</label>
                            <input type="email" id="Email-id" placeholder="Enter Email-ID">
                        </div><div class="form-group">
                            <label for="Contact">Contact</label>
                            <input type="number" id="contact" placeholder="Enter Contact number">
                        </div>

                    </form>
                    <button type="submit" class="btn">Register</button>
        </section>
        <section class="card">
            <h2>Registered User</h2>
        </section>
    </main>
    <footer>

    </footer>
