<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <title>Student Registration System</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1 class="header">Student Registration System</h1>
    </header>
    <main class="grid-2col">
        <!-- Student Form -->
        <section class="card">
            <h2>Student Details</h2>
            <form id="student-form">
                <!-- Student Name -->
                <div class="form-group">
                    <label for="student-name">Full Name</label>
                    <input class="studentName" type="text" id="student-name" placeholder="Enter Student Name" autocomplete="off">
                </div>
                <!-- Student ID -->
                <div class="form-group">
                    <label for="student-id">Student ID</label>
                    <input class="studentId" type="number" id="student-id" placeholder="Enter Student ID" inputmode="numeric" autocomplete="off">
                </div>
                <!-- Email -->
                <div class="form-group">
                    <label for="email-id">Email ID</label>
                    <input class="email" type="email" id="email-id" placeholder="Enter Email ID" autocomplete="off">
                </div>
                <!-- Contact -->
                <div class="form-group">
                    <label for="contact">Contact Number</label>
                    <input class="contact" type="number" id="contact" placeholder="Enter Contact Number" inputmode="numeric" autocomplete="off">
                </div>
                <button type="submit" class="btn">Register</button>
            </form>
        </section>
        <!-- Registered Students -->
        <section class="card">
            <h2>Registered Users</h2>
            <!-- JavaScript dynamic scroll bar -->
            <div class="table-container">
                <table class="userTable">
                    <thead>
                        <tr>
                            <th>Full Name</th>
                            <th>Student ID</th>
                            <th>Email ID</th>
                            <th>Contact</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody class="userTableBody">
                        <!-- Registered Students -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
<footer>
</footer>
</html>
