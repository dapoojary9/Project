<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast</title>
    <link rel="stylesheet" href="./src/output.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-blue-400 text-white min-h-screen">
    <div class="max-w-4xl mx-auto px-4 py-8">
        <header class="mb-6 text-center">
            <h1 class="text-3xl font-bold">Weather Forecast</h1>
            <p class="text-blue-200 mt-1">Check today's weather and the next 5 days</p>
        </header>
        <section class ="bg-white rounded-lg p-1 mb-6">
            <div class = "sm:flex sm:items-center">
                <input id = "cityInput" type = "text" placeholder = "Enter city name" class = "w-full sm:flex-1 px-3 py-1 rounded text-gray-800 mb-2 sm:mb-0 sm:mr-1"/>
                <button id = "searchBtn" type = "button" class = "w-full sm:w-auto bg-blue-500 text-white font-semibold px-4 py-1 rounded mb-1 sm:mb-0 sm:mr-1">Search</button>
                <button id = "locationBtn" type = "button" class = "w-full sm:w-auto bg-blue-500 text-white font-semibold px-4 py-1 rounded">My Location</button>
            </div>
        </section>
        <p id="errorBox" class="hidden mt-3 bg-red-600 text-white text-sm px-3 py-2 rounded"></p>
        <p id="loading" class="hidden text-center text-blue-200 mb-6">Leading Weather Data</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
