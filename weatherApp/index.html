<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./src/output.css" rel="stylesheet">
    <style href="style.css" ></style>
    <title>Weather Forecast</title>
    <script src="script.js" ></script>
</head>
<body class="bg-blue-200 min-h-screen">
    <div class="max-w-4xl mx-auto px-4 py-8">
        <header>
            <h1 class="text-4xl font-bold text-slate-500" style="padding: 25px; ; display: flex; flex-direction: row; justify-content: center;">Weather Forecast</h1>
        </header> 
        <section class="bg-white rounded-lg p-4 mb-6">
            <div class="sm:flex sm:items-center">
                <input id="cityInput" type="text" placeholder="Enter city name" class="w-full sm:flex-1 px-3 py-2 rounded text-gray-800 mb-2 sm:mb-0 sm:mr-2"/>
                <button id="searchBtn" type="button" class="w-full sm:w-auto bg-blue text-blue-800 font-semibold px-4 py-2 rounded mb-2 sm:mb-0 sm:mr-2">Search</button>
             <button id="locationBtn" type="button" class="w-full sm:w-auto bg-blue-500 text-white font-semibold px-4 py-2 rounded">My Location</button>
            </div>
        </section>
    </div>
</body>
</html>
